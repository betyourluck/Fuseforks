[package]
name = "lock_probe"
version = "0.0.0"
edition = "2024"
# `std::fs::File::try_lock` が安定化した版（Spec 64 D3）。redb 4.1.0 自身も
# rust-version = "1.89" で、内部のロックに同じ関数を使っている。
rust-version = "1.89"
publish = false
license = "MPL-2.0"

[dependencies]
# ルートの Cargo.lock と同じ版に固定する（測るのはこの版の挙動）。
redb = "=4.1.0"

# ルートの workspace の外に置く（members に入れない）。Spec 64 P0 の測定のためだけの
# 使い捨てで、配布物にもテストにもならない。
[workspace]
