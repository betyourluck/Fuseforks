[package]
name = "agent-core"
description = "Concordia のマルチエージェント・オーケストレーション中核。GUI 層に一切依存しない。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
image.workspace = true
command-group.workspace = true
keyring.workspace = true
pulldown-cmark.workspace = true
rayon.workspace = true
redb.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
sys-locale.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml_edit.workspace = true
trash.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
# `net` / `io-util` はテスト専用。JPEG フォールバック（Spec 23 D3）の配線は
# HTTP の応答コードで分岐するので、ループバックに最小のスタブを立てて踏む。
# **配布物の依存は増えない**（dev-dependencies なので）。
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "time",
  "test-util",
  "net",
  "io-util",
] }

[lints.rust]
# GUI 層への逆依存を機械的に禁じるための最低限の衛生設定。
unsafe_code = "forbid"
missing_docs = "warn"
