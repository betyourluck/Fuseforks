[workspace]
resolver = "3"
members = ["apps/gui-tauri/src-tauri", "crates/agent-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }

async-trait = "0.1"
# OS の資格情報ストア。Windows 資格情報マネージャー / macOS Keychain /
# freedesktop Secret Service を同一 API で扱う。各 feature は target_os で
# ゲートされるため、全プラットフォーム分を列挙してよい。
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

# リリースビルドは GUI クレート側の要求（サイズ最適化）に合わせてワークスペース単位で固定する。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
