[workspace]
resolver = "3"
members = ["apps/gui-tauri/src-tauri", "crates/agent-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# AGPL-3.0-or-later (2026-08-02 公開に合わせて MIT から変更。README「ライセンス」節が意図の正)。
license = "AGPL-3.0-or-later"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }

async-trait = "0.1"
# 予定の発火規則（Spec 07）で使うカレンダー計算。「次の木曜 17 時（現地時刻）」は
# epoch ミリ秒の演算では出せない（曜日・DST・月末）。自前で書くとカレンダーの
# 再発明になり、必ずどこかで間に合わせになる。
#
# 既定 feature のうち wasmbind は要らない（コアは wasm を対象にしない）ので
# default-features = false にして clock / std だけを取る。
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# テスト専用。DST を持つタイムゾーン（America/New_York）を使って、
# 「存在しない時刻・曖昧な時刻で panic しない」契約を実際に走らせるため。
# 日本には DST が無いので、実行機の Local ではこの経路を一度も通れない。
chrono-tz = "0.10"
# OS の資格情報ストア。Windows 資格情報マネージャー / macOS Keychain /
# freedesktop Secret Service を同一 API で扱う。各 feature は target_os で
# ゲートされるため、全プラットフォーム分を列挙してよい。
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
rayon = "1.10"
# 会話の永続化（Spec 12）の保存先。**純 Rust・C 依存なし・依存 2 個**の
# 組み込み KV ストアで、`(session_id, seq)` のタプルキー範囲走査が
# 「後ろから N 件」を O(log n + k) で返す（実測 0.03 ms / 20,000 件）。
#
# 自前の JSONL + index.json を採らなかったのは、索引ファイルを置いた時点で
# **真実が 2 つ**になり、原子性の破れと fork の孤児がその帰結だったため
# （Spec 12 rev2 の R0）。redb は機構を足すのではなく減らす —
# temp+rename の自前実装・壊れた行の切り捨て・fork の 2 段階が全部消える。
#
# rusqlite（bundled）は依存 10 個で C の SQLite を同梱し、tantivy + lindera は
# 451 依存かつ zstd-sys で C が戻る。全文検索は v1 では作らない
# （20,000 件の全走査が 11 ms）ので、その値段を払う理由が無い。
#
# 実測（2026-08-03 の追加時）: Cargo.lock に増えたのは **redb の 1 行だけ**。
# 見積もりの「2 依存」は既にツリーに居たため、コンパイル対象は実質 1 crate 増。
redb = "4.1"
# 同梱 grep ツールの検索構文。モデルは正規表現でパターンを書く学習分布を持つので、
# 独自のミニ構文を発明するより標準の regex を渡すほうが失敗が少ない。
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# UI 言語の初回確定（Spec 13）。Webview の navigator.language は OS 設定と
# ズレるため、OS のロケールを直接読む。使うのは起動時の 1 回だけで、
# コアは確定した値で分岐しない（settings_contract の案 A）。依存ゼロの小 crate。
sys-locale = "0.3"
# MCP (Model Context Protocol) の公式 Rust SDK。**クライアント側だけ**を使う。
#
# LLM のワイヤ形は自前で持っている（プロンプトキャッシュの制御に踏み込む必要があり、
# 互換層では機能の交差集合しか使えないため）が、MCP は事情が違う:
# 仕様が広く（handshake / capabilities / 通知 / キャンセル / ページング）、
# しかも速い周期で改訂される。自前で持っても得るものが無い。
#
# 既定 feature の server / macros は要らない。この app は MCP サーバーではなく
# **クライアント**であり、繋ぐ先は子プロセスとして起動する stdio サーバー。
# 将来リモート HTTP サーバーへ繋ぐなら transport-streamable-http-client-reqwest を足す。
rmcp = { version = "2.2", default-features = false, features = [
  "client",
  "transport-child-process",
  # PATH からコマンドを解決する。**Windows で必須**: 素の `npx` は拡張子なしの
  # スクリプトとしても PATH に居るため、CreateProcess が実行できず
  # `program not found` になる。Claude Desktop の設定は素の `npx` で書かれており、
  # 「そのまま貼れる」と謳う以上ここを解決しないと嘘になる (実測で確認済み)。
  "which-command",
] }
serde = { version = "1", features = ["derive"] }
# preserve_order: JSON オブジェクトのキー順を挿入順で保持する（内部が IndexMap になる）。
# 同梱 yq の「編集してもキー順を壊さない」契約に必要。ワイヤ層にも及ぶが、
# 順序が安定する方向の変化であり、プロンプトキャッシュにも不利にならない。
serde_json = { version = "1", features = ["preserve_order"] }
# 同梱 diff ツールの unified diff 生成。行差分の LCS を自前で書くより
# 実績のある純 Rust 実装に任せる（similar は insta 等でも使われる定番）。
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "process"] }
# 登録済みコマンドの実行（Spec 15）でプロセスを**木ごと**止めるため。
# tokio::process::Child::kill は対象 PID にしか効かず孫が残る（pytest が起動した
# 子が生き残る）。Windows は Job Object の JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE、
# Unix は setsid + kill(-pgid) が要るが、どちらも unsafe を書くことになる —
# このクレートは unsafe_code = "forbid" なので自前では書けない。trash を足した
# ときと同じ判断で、安全側の挙動を自前の unsafe で書かない。
command-group = { version = "5", features = ["with-tokio"] }
# 割り込み停止（Spec 10）の階層キャンセル。CancellationToken は tokio 本体に
# 無い（1.52.3 実ソースと docs.rs の 2 経路で確認済み）。child_token の意味論
# （親の cancel は全子へ / 子は親へ遡らない / cancel 済みの親の子は cancel 済みで
# 生まれる）が伝播設計の根拠。既に間接依存としてツリーに居るため、直接化で
# コンパイル対象は増えない。既定 feature だけで sync モジュールが入る。
tokio-util = "0.7"
# 同梱 yq の TOML 編集。コメント・フォーマットを保持する format-preserving parser
# （cargo 自身が使うデファクト）。
# なお YAML は対応しない: 候補だった yaml-edit 0.2 は PoC で棄却した
# （先頭コメント消失・数値の文字列化・set_path の構造破壊・clone 間の変更共有。
# Spec 01 Phase 4 の記録参照）。コメント保持で信頼できる YAML 編集 crate が
# 現状のエコシステムに無い。
toml_edit = "0.25"
# 同梱 file ツールの削除（Spec 09）。**完全削除の経路を作らない**ための依存で、
# Windows ごみ箱 / macOS Trash / freedesktop Trash を同一 API で扱う。
# ファイル操作の本体は std::fs で足りる（create_dir_all / rename / copy /
# read / write）— crate を足す価値があるのはここだけだった。ごみ箱が使えない
# 環境では失敗として返し、黙って完全削除へフォールバックしない。
trash = "5"
uuid = { version = "1", features = ["v4", "serde"] }

# リリースビルドは GUI クレート側の要求（サイズ最適化）に合わせてワークスペース単位で固定する。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
