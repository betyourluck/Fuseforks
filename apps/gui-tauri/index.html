<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ブランド名のみ（言語の外）。説明的な副題は言語を選ぶので置かない。 -->
    <title>Fuseforks</title>
    <style>
      :root {
        --boot-surface: oklch(0.19 0.012 265);
        --boot-ink-dim: oklch(0.68 0.014 265);
        --boot-line: oklch(0.36 0.018 265);
        --boot-accent: oklch(0.72 0.14 232);
      }

      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }

      body {
        background-color: var(--boot-surface);
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background-color: var(--boot-surface);
        color: var(--boot-ink-dim);
        font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--boot-line);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-line {
        color: var(--boot-accent);
        /* Tailwind の font-mono（App.vue の覆い）と同じ並び。揃えないと引き継ぎで字体が変わる */
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!--
        Vue がマウントするまでの初期表示。マウント後は App.vue の覆いが
        同じ見た目（.boot-splash / .boot-spinner は style.css で共有）を
        引き継ぐため、切り替わりの継ぎ目は見えない。
        CSS はビルド時に <head> へリンクされるので、この時点で適用済み。
      -->
      <!-- ここは i18n の到達前（言語は world.json にあり IPC が要る）。
           **確定できない場所では英語だけを出す**（2026-09-14 利用者裁定。旧: 二言語併記）—
           英語圏以外の人が英語だけを見る違和感より、英語圏の人が見知らぬ文字の並びを見る
           違和感のほうが強い。マウント後の App.vue の覆いは表示言語に追従する。
           文字は小さい等幅の 1 行で、色は標準色（accent）。発光も「# 」も付けない
           （2026-09-19 利用者裁定。旧: 利用者提供 SVG から抜いた 28px の緑の発光文字）。 -->
      <div class="boot-splash">
        <span class="boot-spinner" aria-hidden="true"></span>
        <span class="boot-line">starting up...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
