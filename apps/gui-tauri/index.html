<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tauri.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concordia — マルチエージェント・オーケストレーション</title>
    <style>
      :root {
        --boot-surface: oklch(0.19 0.012 265);
        --boot-ink-dim: oklch(0.68 0.014 265);
        --boot-line: oklch(0.36 0.018 265);
        --boot-accent: oklch(0.72 0.14 232);
      }

      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }

      body {
        background-color: var(--boot-surface);
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background-color: var(--boot-surface);
        color: var(--boot-ink-dim);
        font-family: "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid var(--boot-line);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <!--
        Vue がマウントするまでの初期表示。マウント後は App.vue の覆いが
        同じ見た目（.boot-splash / .boot-spinner は style.css で共有）を
        引き継ぐため、切り替わりの継ぎ目は見えない。
        CSS はビルド時に <head> へリンクされるので、この時点で適用済み。
      -->
      <!-- ここは i18n の到達前（言語は world.json にあり IPC が要る）。
           確定できない場所では選ばず、二言語を併記する。 -->
      <div class="boot-splash">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p>初期起動中… / Starting up…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
