[package]
name = "fuseforks"
description = "Fuseforks — マルチエージェント・オーケストレーション GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `_lib` 接尾辞は冗長に見えるが、Windows で bin 名と衝突させないために必要。
# https://github.com/rust-lang/cargo/issues/8519
name = "fuseforks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 中核ロジック。依存はこの一方向だけ。fuseforks-core 側は tauri を知らない。
fuseforks-core.workspace = true
# ホスト層（Spec 64）。組み立ての配線と棚（扉・前判定の承認・Jev・単価表の取得元）は
# こちらに住み、GUI はそれを呼んで IPC へ繋ぐだけ。fuseforks-host 側も tauri を知らない。
fuseforks-host.workspace = true

# IPC で届く添付画像の base64 復号（Spec 23）。復号は IPC 境界で 1 回、
# 検証と保存はコア側（AttachmentStore::save）。
base64.workspace = true

# 予定一覧の「次回の発火予定時刻」をコア側の現在時刻で評価するため（Spec 07）。
# カレンダー計算をフロントへ持たせない — 真実が 2 箇所できる。
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# トレイ（Spec 69 D2）。tray-icon はロックに既に在り、機能を有効にしても行は増えない（P0 実測）。
tauri = { version = "2", features = ["tray-icon"] }
# 作業フォルダを選ぶネイティブダイアログ（パスを返すだけ。開く側は opener）。
# 絶対パスを手で打たせると、区切り文字と綴りの取り違えがそのまま
# 「作業フォルダが存在しません」になり、直す手掛かりが画面に無い。
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true

# デスクトップ限定。クレート自体が Android/iOS で空になるので、
# ここで target を切って mobile ビルドから外す（Spec 07 P0）。
#
# **[target.…] 節は必ず [dependencies] より後ろに置く。** 途中へ挟むと、
# それ以降の依存がすべて target 条件つきとして再分類される（TOML の節の意味論）。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

# サインイン時の自動起動（Spec 69 D4）。Windows は windows-registry で自前で書く（裁定 4）—
# 値の形が auto-launch の内部の format! に寄りかからず、登録先を読む側と同じ crate で揃う。
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# エラーの型（HRESULT のコード）を名指しするため。windows-registry は Error を公開していない。
windows-result = "0.4"

# macOS（LaunchAgent）と Linux（XDG）は auto-launch 0.6。Windows の依存には入れない。
[target.'cfg(not(windows))'.dependencies]
auto-launch = "0.6"

# リリースプロファイルはワークスペースルートで定義している
# （非ルートパッケージの [profile] は無視されるため）。
