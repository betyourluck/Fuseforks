[package]
name = "concordia"
description = "Concordia — マルチエージェント・オーケストレーション GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `_lib` 接尾辞は冗長に見えるが、Windows で bin 名と衝突させないために必要。
# https://github.com/rust-lang/cargo/issues/8519
name = "concordia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 中核ロジック。依存はこの一方向だけ。agent-core 側は tauri を知らない。
agent-core.workspace = true

# 予定一覧の「次回の発火予定時刻」をコア側の現在時刻で評価するため（Spec 07）。
# カレンダー計算をフロントへ持たせない — 真実が 2 箇所できる。
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true

# デスクトップ限定。クレート自体が Android/iOS で空になるので、
# ここで target を切って mobile ビルドから外す（Spec 07 P0）。
#
# **[target.…] 節は必ず [dependencies] より後ろに置く。** 途中へ挟むと、
# それ以降の依存がすべて target 条件つきとして再分類される（TOML の節の意味論）。
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

# リリースプロファイルはワークスペースルートで定義している
# （非ルートパッケージの [profile] は無視されるため）。
